name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          mkdir -p Sten.app/Contents/MacOS Sten.app/Contents/Resources
          swift build -c release
          cp .build/release/Sten Sten.app/Contents/MacOS/
          cp app/Sten/Info.plist Sten.app/Contents/
          cp icons/*.png icons/*.icns Sten.app/Contents/Resources/ 2>/dev/null || true

      - name: Create zip
        run: zip -r Sten.zip Sten.app

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Sten.zip
          generate_release_notes: true
